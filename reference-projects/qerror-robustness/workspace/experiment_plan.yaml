confirmatory: true
hypotheses:
  - H1 learned estimators degrade more under distribution shift than classical estimators
  - H2 in-distribution Q-error does not predict shifted Q-error across estimator families
primary_metrics: [geomean_qerror]
exclusions: [SQLite execution failure, schema build failure, invalid Q-error]
stopping_rule: execute every prespecified trial once
evaluation_units: [in-distribution-query-set, shifted-query-set, learned-estimator-held-out-split]
seeds: [0, 1, 2, 3, 4]
metrics:
  - primary_metric
  - geomean_qerror
  - p95_qerror
  - max_qerror
  - degradation_ratio
  - effect_size
  - baseline_qerror
  - ci_low
  - ci_high
  - ci_width
  - shift_pct_change
  - n_queries
  - runtime_sec
  - compute_units
confidence_intervals: true
effect_sizes: true
compute_reporting: true
data_split: 70/30 train-test split for learned estimator; full eval for classical
tuning_allowance: prespecified estimators only; no post-result tuning
resource_budget: one local CPU process and 180 seconds per trial
uncertainty: 95% bootstrap confidence interval over per-query Q-error geomean
system_versions: [Python stdlib sqlite3, SQLite version recorded per trial]
scale_factor: 59000 rows across 4 tables
concurrency: 1
isolation_level: single in-memory connection per trial
warmup: single unmeasured query pass before recording
repetitions: 1
timeout_policy: 180-second hard process timeout recorded in ledger
correctness_check: true cardinality counted via COUNT(*) on the materialized database
matched_hardware: true
