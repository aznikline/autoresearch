stopping_rule: execute every prespecified trial once
evaluation_units:
- hourly-demand
- weather-filter
- season-summary
seeds:
- 0
- 1
- 2
- 3
- 4
metrics:
- primary_metric
- p50_latency_ms
- p95_latency_ms
- p99_latency_ms
- throughput_qps
- correctness_rate
- ci_low
- ci_high
- effect_size
- runtime_sec
- compute_units
confidence_intervals: true
effect_sizes: true
compute_reporting: true
data_split: immutable full hourly workload; no learned model or train/test split
tuning_allowance: prespecified indexes only; no post-result tuning
resource_budget: one local CPU process and 30 seconds per trial
uncertainty: normal-approximation confidence interval over repeated query latency
system_versions:
- Python stdlib sqlite3
- SQLite version recorded per trial
