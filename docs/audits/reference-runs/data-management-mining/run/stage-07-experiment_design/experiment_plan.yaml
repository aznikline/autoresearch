topic: SQLite index tradeoffs on the UCI Bike Sharing hourly workload
metric_key: primary_metric
metric_direction: minimize
time_budget_sec: 30
trials:
- trial_id: baseline-seed0
  description: No secondary indexes, seed 0.
  parameters:
    seed: 0
    index_count: 0
- trial_id: baseline-seed1
  description: No secondary indexes, seed 1.
  parameters:
    seed: 1
    index_count: 0
- trial_id: baseline-seed2
  description: No secondary indexes, seed 2.
  parameters:
    seed: 2
    index_count: 0
- trial_id: baseline-seed3
  description: No secondary indexes, seed 3.
  parameters:
    seed: 3
    index_count: 0
- trial_id: ablation-hour-index-seed1
  description: Add only an hour index.
  parameters:
    seed: 1
    index_count: 1
- trial_id: ablation-weather-index-seed2
  description: Add only a weather and working-day index.
  parameters:
    seed: 2
    index_count: 1
- trial_id: ablation-season-index-seed3
  description: Add only a season and year index.
  parameters:
    seed: 3
    index_count: 1
- trial_id: ablation-composite-index-seed4
  description: Add all three workload-specific indexes.
  parameters:
    seed: 4
    index_count: 3
confirmatory: true
hypotheses:
- H1 workload-matched indexes reduce read-query tail latency
- H2 index maintenance and query shape prevent uniform latency gains
primary_metrics:
- p95_latency_ms
exclusions:
- CSV parse failure
- SQLite execution failure
- incorrect query result
