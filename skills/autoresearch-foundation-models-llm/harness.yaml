stage_instructions:
  hypothesis_generation: Define competing capability and artifact hypotheses with contamination and judge-validity risks.
  experiment_design: Freeze models tokenizers prompts decoding datasets judges seeds and resource budgets.
  experiment_loop: Preserve generations judge outputs safety outcomes failures latency tokens and cost.
  result_analysis_decision: Analyze uncertainty judge agreement contamination and quality-safety-cost tradeoffs.
  paper_draft_revision: Scope capability claims to tested models tasks and evaluators.
  final_verification_export: Block on missing model identity contamination analysis judge validation or provenance.
references:
