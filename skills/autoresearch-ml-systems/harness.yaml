stage_instructions:
  hypothesis_generation: Define competing falsifiable hypotheses, expected effect sizes, disconfirming evidence, confounds, and the cheapest distinguishing experiment.
  experiment_design: Freeze protocol parity, primary metrics, evaluation units, seeds, baselines, ablations, stopping rules, statistical tests, and compute accounting before execution.
  experiment_loop: Do not mutate the evaluator. Preserve every run and decide keep, discard, or inconclusive only from prespecified evidence.
  result_analysis_decision: Report uncertainty, practical significance, quality-efficiency tradeoffs, failed runs, and supported, refuted, or inconclusive outcomes.
  paper_draft_revision: Draft claims only from registries and include limitations, resource disclosure, and artifact-backed reproduction instructions.
  final_verification_export: Block submission readiness on any missing provenance, protocol parity, depth requirement, claim link, or artifact.
